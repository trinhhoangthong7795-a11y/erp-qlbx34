name: Build QLBX34 Android APK
on:
  push:
    branches: [main, master]
  workflow_dispatch:
permissions:
  contents: read
  actions: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
      - name: Install Android SDK packages
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Generate Gradle wrapper
        working-directory: android
        run: gradle wrapper --gradle-version 8.9
      - name: Build installable debug APK
        working-directory: android
        run: ./gradlew --no-daemon clean assembleDebug
      - name: Rename APK
        run: |
          mkdir -p dist
          cp android/app/build/outputs/apk/debug/app-debug.apk dist/QLBX34_BaiXe34_v2.apk
          test -s dist/QLBX34_BaiXe34_v2.apk
      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: QLBX34_BaiXe34_v2
          path: dist/QLBX34_BaiXe34_v2.apk
          if-no-files-found: error
          retention-days: 30
