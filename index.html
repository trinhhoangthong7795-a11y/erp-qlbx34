<!doctype html>
<html lang="vi"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#203f60"><title>QLBX Chat ERP 34</title>
<link rel="manifest" href="./manifest.webmanifest">
<meta name="description" content="QLBX Chat ERP 34 - quản lý bãi xe">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
</head><body><main style="font:16px system-ui;max-width:620px;margin:12vh auto;padding:24px;color:#20384d"><h2>QLBX Chat ERP 34</h2><p>Đang tải ứng dụng…</p></main>
<script>
fetch('./app.html',{cache:'no-store'}).then(r=>{if(!r.ok)throw Error('HTTP '+r.status);return r.text()}).then(html=>{
 const doc=new DOMParser().parseFromString(html,'text/html');
 document.documentElement.replaceChild(doc.head,document.head);
 document.body.replaceWith(doc.body);
 [...doc.querySelectorAll('script')].forEach(old=>{
  const s=document.createElement('script');
  for(const a of old.attributes)s.setAttribute(a.name,a.value);
  s.textContent=old.textContent;
  document.body.appendChild(s);
 });
}).catch(err=>{document.body.innerHTML='<main style="font:16px system-ui;margin:12vh auto;padding:24px"><h2>Không tải được ứng dụng</h2><p>'+String(err.message)+'</p><p>Kiểm tra Internet và tải lại trang.</p></main>';});
</script></body></html>
